<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#faf8f5;min-height:100vh}

.sessions-week{margin-bottom:28px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000}

.modal-title{font-size:18px;font-weight:700;color:#1a1a1a}

.btn-gen{background:#E85D20;color:#fff;border:none;border-radius:9px;padding:10px 20px;font-size:14px;font-weight:600;width:100%;margin-bottom:18px}
.token-list{display:flex;flex-direction:column;gap:10px;max-height:280px;overflow-y:auto}

.token-val{font-size:13px;font-weight:600;color:#1a1a1a;font-family:monospace}
.token-date{font-size:11px;color:#aaa;margin-top:2px}
.btn-copy{background:#fff;color:#555;border:1px solid #e0dbd5;border-radius:7px;padding:6px 12px;font-size:12px;white-space:nowrap}

.btn-revoke{background:#fff;color:#c0392b;border:1px solid #e0dbd5;border-radius:7px;padding:6px 10px;font-size:12px}
.modal-footer{margin-top:18px;font-size:12px;color:#bbb;text-align:center}
.token-empty{text-align:center;color:#aaa;font-size:14px;padding:20px 0}

.login-wrap{min-height:100vh;background:#faf8f5;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:18px;padding:40px 44px;width:400px;max-width:95vw;border:1px solid #e8e4df;text-align:center}
.login-icon{width:44px;height:44px;background:#E85D20;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:22px}
.login-title{font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:6px}
.login-sub{font-size:14px;color:#888;margin-bottom:28px}
.login-input{width:100%;border:1.5px solid #e0dbd5;border-radius:9px;padding:12px 14px;font-size:15px;font-family:monospace;outline:none;margin-bottom:12px;text-align:center;letter-spacing:1px}
.login-error{color:#c0392b;font-size:13px;margin-bottom:10px}
.btn-login{width:100%;background:#E85D20;color:#fff;border:none;border-radius:9px;padding:12px;font-size:15px;font-weight:600}

.loading-screen{min-height:100vh;background:#faf8f5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#888;font-size:14px}
.spinner{width:36px;height:36px;border:3px solid #e8e4df;border-top-color:#E85D20;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}


@media(max-width:600px){
  .ts-header,.ts-row{grid-template-columns:1fr 120px 50px}
  .ts-header span:nth-child(3),.ts-row>div:nth-child(3){display:none}
  .week-bars{flex-direction:column}
  .topbar{padding:0 14px}
  .main{padding:20px 14px}

</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════
//  ⚙️  CONFIGURATION — paste your Supabase values here
// ══════════════════════════════════════════════════════════════════
const SUPABASE_URL  = "https://okczdushlbkbmxsqbtfo.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rY3pkdXNobGJrYm14c3FidGZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxOTM5ODEsImV4cCI6MjA5NDc2OTk4MX0.m_xdB1JeDU0lK3N-kD79Th1tOmi7eaZOlCP6lSPHuZs";
// ══════════════════════════════════════════════════════════════════

const OWNER_PIN = "1234"; // 🔐 Change this to your own PIN
const CONFIGURED = SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_ANON !== "YOUR_SUPABASE_ANON_KEY";

// ── Data ───────────────────────────────────────────────────────────
const TASKS = {
  week1:{label:"WEEK 1",color:"#E85D20",days:"Days 1–5",title:"Introduction to Digital CS at SmartBear",
    intro:"In your first week, the focus will be on understanding the Digital CS motion at SmartBear. These sessions will be led by your manager, who will schedule calendar slots for the discussions.",
    tasks:[
      {label:"How Digital CS creates value for customers and the business",focus:"Value & Impact"},
      {label:"The major focus areas of the Digital CS team",focus:"Team Structure"},
      {label:"Key outcomes and success metrics",focus:"KPIs & Planning"},
      {label:"How the team collaborates with other functions",focus:"Stakeholder Mapping"},
    ]},
  week2:{label:"WEEK 2",color:"#0F6E56",days:"Days 6–10",title:"SmartBear Tools and Resources",
    intro:"The second week will focus on getting familiar with the tools and systems used across SmartBear and Digital CS. The goal is to help you understand where information lives, how customer data is tracked, and how the Digital CS team uses these tools in day-to-day workflows.",
    tasks:[
      {label:"Planhat",focus:"Customer Success Platform"},
      {label:"Amplitude / Mixpanel and Other Data Integrations",focus:"Analytics & Data"},
      {label:"CS Resources: Confluence",focus:"Knowledge Management"},
      {label:"Salesforce",focus:"CRM & Customer Data"},
    ]},
  week3:{label:"WEEK 3",color:"#534AB7",days:"Days 11–15",title:"Product and Enablement Overview",
    intro:"In your third week, the focus will shift toward SmartBear's product offering and key product areas. By the end of week three, you should have a strong foundation in the Digital CS motion, the tools we use, and the products we support.",
    tasks:[
      {label:"API Design and Testing",focus:"Technical Foundations"},
      {label:"Test Management Basics",focus:"QA & Testing"},
      {label:"SmartBear Product Offering",focus:"Product Knowledge"},
      {label:"Relevant Enablement Sessions",focus:"Enablement"},
    ]},
};
const TOOLS=[
  {name:"Salesforce",icon:"☁️",desc:"CRM & customer data"},
  {name:"Amplitude",icon:"📊",desc:"Product analytics"},
  {name:"Planhat",icon:"🎯",desc:"Customer success platform"},
  {name:"Claude",icon:"🤖",desc:"AI assistant & tooling"},
  {name:"Zoom",icon:"📹",desc:"Video conferencing"},
];

// ── Supabase client (official supabase-js, handles CORS automatically) ──
const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const SB = {
  async loadAll(){
    const [{ data: progRows }, { data: tokenRows }] = await Promise.all([
      _sb.from("dcs_progress").select("*").eq("id","singleton"),
      _sb.from("dcs_tokens").select("*").order("created_at",{ascending:true}),
    ]);
    const prog = (progRows && progRows[0]) || {progress:{},timestamps:{},tool_access:{}};
    return {
      progress:   prog.progress    || {},
      timestamps: prog.timestamps  || {},
      toolAccess: prog.tool_access || {},
      tokens:     (tokenRows||[]).map(t=>({token:t.token, createdAt: new Date(t.created_at).getTime()})),
    };
  },

  async saveProgress(progress, timestamps){
    const { error } = await _sb.from("dcs_progress").upsert(
      {id:"singleton", progress, timestamps, updated_at: new Date().toISOString()},
      {onConflict:"id"}
    );
    if(error) throw new Error(error.message);
  },

  async saveToolAccess(toolAccess){
    const { error } = await _sb.from("dcs_progress").upsert(
      {id:"singleton", tool_access: toolAccess, updated_at: new Date().toISOString()},
      {onConflict:"id"}
    );
    if(error) throw new Error(error.message);
  },

  async addToken(token){
    const { error } = await _sb.from("dcs_tokens").insert({token});
    if(error) throw new Error(error.message);
  },

  async deleteToken(token){
    const { error } = await _sb.from("dcs_tokens").delete().eq("token", token);
    if(error) throw new Error(error.message);
  },
};

// ── Fallback localStorage (used when not configured) ──────────────
const SK_TOKENS="dcs_share_tokens", SK_PROGRESS="dcs_task_progress", SK_TIMESTAMPS="dcs_timestamps";
function ls(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// ── State ──────────────────────────────────────────────────────────
let state={
  tokens:[],progress:{},timestamps:{},toolAccess:{},loginMode:'choose',
  activeTab:"plan",expandedWeeks:{week1:true,week2:false,week3:false},
  showShare:false,authed:false,isOwner:false,
  loginError:"",tokenParam:null,copiedToken:null,
  syncStatus:"synced", // "syncing" | "synced" | "error"
  loading:true,
};

(function(){
  const p=new URLSearchParams(window.location.search);
  const t=p.get("token");
  if(t){state.tokenParam=t; state.loginMode='token';}
  // No auto-auth — owner logs in with PIN, shared users with token
})();

function setState(patch){Object.assign(state,patch);render();}

// ── Sync helpers ───────────────────────────────────────────────────
async function loadFromSupabase(){
  if(!CONFIGURED){
    state.tokens    = ls(SK_TOKENS)||[];
    state.progress  = ls(SK_PROGRESS)||{};
    state.timestamps= ls(SK_TIMESTAMPS)||{};
    try{const s=localStorage.getItem("dcs_tool_access");if(s)state.toolAccess=JSON.parse(s);}catch(e){}
    state.loading = false;
    render(); return;
  }
  try{
    const data = await SB.loadAll();
    // Merge ALL data including tokens before showing login
    state.tokens     = data.tokens     || [];
    state.progress   = data.progress   || {};
    state.timestamps = data.timestamps || {};
    state.toolAccess = data.toolAccess || {};
    state.loading    = false;
    state.syncStatus = "synced";
    // Auto-validate token from URL now that tokens are loaded
    if(state.tokenParam){
      const found = state.tokens.find(t=>t.token===state.tokenParam);
      if(found){ state.authed=true; state.isOwner=false; }
    }
    render();
  }catch(e){
    console.error("Supabase load error",e);
    // Fall back to localStorage — tokens will be empty on fresh devices
    state.tokens    = ls(SK_TOKENS)||[];
    state.progress  = ls(SK_PROGRESS)||{};
    state.timestamps= ls(SK_TIMESTAMPS)||{};
    try{const s=localStorage.getItem("dcs_tool_access");if(s)state.toolAccess=JSON.parse(s);}catch(ex){}
    state.loading    = false;
    state.syncStatus = "error";
    if(state.tokenParam){
      const found = state.tokens.find(t=>t.token===state.tokenParam);
      if(found){ state.authed=true; state.isOwner=false; }
    }
    render();
  }
}

let saveTimer=null;
function scheduleSave(progress, timestamps){
  setState({syncStatus:"syncing"});
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(!CONFIGURED){
      lsSet(SK_PROGRESS,progress);
      lsSet(SK_TIMESTAMPS,timestamps);
      setState({syncStatus:"synced"}); return;
    }
    try{
      await SB.saveProgress(progress,timestamps);
      setState({syncStatus:"synced"});
    }catch(e){
      console.error("Save error",e);
      setState({syncStatus:"error"});
    }
  },600);
}

// ── Actions ────────────────────────────────────────────────────────
function genToken(){return Math.random().toString(36).slice(2,10).toUpperCase()+"-"+Math.random().toString(36).slice(2,10).toUpperCase();}
function fmtTs(ts){if(!ts)return"—";return new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function calcDur(s,e){if(!s||!e)return null;const m=Math.round((e-s)/60000);if(m<60)return m+"m";const h=Math.floor(m/60),r=m%60;return r>0?h+"h "+r+"m":h+"h";}

function toggleTask(week,idx){
  const key=week+"-"+idx, now=Date.now(), wasDone=!!state.progress[key];
  const progress={...state.progress,[key]:!wasDone};
  const ts={...state.timestamps};
  if(!wasDone){ts[key]=ts[key]?{...ts[key],completedAt:now}:{startedAt:now,completedAt:now};}
  else{ts[key]={startedAt:ts[key]?ts[key].startedAt:now,completedAt:null};}
  setState({progress,timestamps:ts});
  scheduleSave(progress,ts);
}

function startTask(week,idx){
  const key=week+"-"+idx;
  if(state.timestamps[key]&&state.timestamps[key].startedAt)return;
  const timestamps={...state.timestamps,[key]:{startedAt:Date.now(),completedAt:null}};
  setState({timestamps});
  scheduleSave(state.progress,timestamps);
}

async function createToken(){
  const token=genToken();
  const newToken={token,createdAt:Date.now()};
  const tokens=[...state.tokens,newToken];
  setState({tokens});
  if(CONFIGURED){
    try{
      await SB.addToken(token);
      console.log("Token saved to Supabase:", token);
    }catch(e){
      console.error("Token save error:", e.message);
      // Still keep it in local state so owner can use it this session
    }
  } else {
    lsSet(SK_TOKENS,tokens);
  }
}

async function revokeToken(token){
  const tokens=state.tokens.filter(t=>t.token!==token);
  setState({tokens});
  if(CONFIGURED){
    try{await SB.deleteToken(token);}
    catch(e){console.error("Token delete error",e);}
  } else {lsSet(SK_TOKENS,tokens);}
}

function copyLink(token){
  const url=window.location.href.split("?")[0]+"?token="+token;
  navigator.clipboard.writeText(url).catch(()=>{});
  setState({copiedToken:token});
  setTimeout(()=>setState({copiedToken:null}),2000);
}

async function login(inputToken){
  if(!inputToken){setState({loginError:"Please enter a token."});return;}
  // Tokens are loaded from Supabase before login screen shows — just check state
  if(state.tokens.find(t=>t.token===inputToken)){
    setState({authed:true,isOwner:false,loginError:""});return;
  }
  // Double-check directly against Supabase in case of sync issues
  if(CONFIGURED){
    try{
      const {data}=await _sb.from("dcs_tokens").select("token").eq("token",inputToken).maybeSingle();
      if(data&&data.token){setState({authed:true,isOwner:false,loginError:""});return;}
    }catch(e){console.error("Token check error",e);}
  }
  setState({loginError:"Invalid or revoked token. Please check and try again."});
}

function loginOwner(pin){
  if(!pin){setState({loginError:"Please enter your PIN."});return;}
  if(pin===OWNER_PIN){setState({authed:true,isOwner:true,loginError:""});}
  else setState({loginError:"Incorrect PIN. Please try again."});
}

// ── DOM helpers ────────────────────────────────────────────────────
function el(tag,props,children){
  const e=document.createElement(tag);
  if(props)Object.entries(props).forEach(([k,v])=>{
    if(k==="className")e.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  (children||[]).forEach(c=>{
    if(c==null||c===false)return;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });
  return e;
}
function pbar(value,color,height){
  const bg=el("div",{className:"progress-bar-bg",style:{height:(height||6)+"px"}});
  const fill=el("div",{className:"progress-bar-fill",style:{width:value+"%",height:"100%",background:color||"#E85D20"}});
  bg.appendChild(fill);return bg;
}

      const opt=document.createElement("option");
      opt.value=val; opt.textContent=lbl;
      if(val===status)opt.selected=true;
      select.appendChild(opt);
    });
    select.addEventListener("change",function(){
      const toolAccess={...state.toolAccess,[tool.name]:this.value};
      setState({toolAccess});
      try{localStorage.setItem("dcs_tool_access",JSON.stringify(toolAccess));}catch(e){}
      if(CONFIGURED){
        SB.saveToolAccess(toolAccess).catch(e=>console.error("Tool save error",e));
      }
    });
    card.append(select);
    list.append(card);
  });
  wrap.append(list);
  // Summary bar
  const grantedCount=TOOLS.filter(t=>(state.toolAccess[t.name]||"pending")==="granted").length;
  const summaryBar=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginTop:"20px",background:"#f9f7f5",border:"1px solid #e8e4df",borderRadius:"12px",padding:"14px 20px"}});
  summaryBar.append(
    el("div",{style:{flex:1,background:"#e8e4df",borderRadius:"99px",height:"8px",overflow:"hidden"}},[
      el("div",{style:{width:(grantedCount/TOOLS.length*100)+"%",height:"100%",background:"#0F6E56",borderRadius:"99px",transition:"width .4s ease"}}),
    ]),
    el("span",{style:{fontSize:"13px",fontWeight:700,color:"#0F6E56",whiteSpace:"nowrap"}},[grantedCount+" / "+TOOLS.length+" granted"]),
  );
  wrap.append(summaryBar);
  wrap.append(el("div",{className:"tools-footer"},[el("strong",{style:{color:"#1a1a1a"}},["Note: "]),"Contact your IT admin or manager to provision access. Most tools require an SSO account linked to your Smartbear email."]));
  return wrap;
}

// ── Main render ────────────────────────────────────────────────────
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(state.loading){app.append(renderLoading());return;}
  if(!state.authed){app.append(renderLogin());return;}
  const root=el("div");
  if(state.showShare)root.append(renderModal());
  root.append(renderTopbar());
  const main=el("div",{className:"main"});
  main.append(el("h1",{className:"page-title"},["Digital CS onboarding"]),el("div",{className:"page-sub"},["Smartbear · 3-week program"]));
  main.append(renderStats(),renderProgressBox(),renderTabs());
  if(state.activeTab==="plan")main.append(renderPlan());
  else if(state.activeTab==="sessions")main.append(renderSessions());
  else if(state.activeTab==="tools")main.append(renderTools());
  root.append(main);
  app.append(root);
}

// ── Boot ───────────────────────────────────────────────────────────
render(); // show loading spinner immediately
loadFromSupabase();
</script>
</body>
</html>
